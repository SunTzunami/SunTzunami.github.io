<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometric Runner Loader Preview</title>
  <script>
  document.documentElement.classList.add("js");
  (function() {
    function getAutoTimeTheme() {
      var hour = new Date().getHours();
      return (hour >= 6 && hour < 18) ? 'light' : 'dark';
    }
    try {
      var stored = localStorage.getItem("theme");
      var initial = (stored === "dark" || stored === "light") ? stored : getAutoTimeTheme();
      document.documentElement.setAttribute("data-theme", initial);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", getAutoTimeTheme());
    }
  })();
  </script>
  <link rel="stylesheet" href="style.css?v=9">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans, -apple-system, sans-serif);
      padding: 2rem;
      box-sizing: border-box;
    }

    .preview-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .preview-header h1 {
      font-family: var(--serif, serif);
      font-size: 1.8rem;
      margin: 0 0 0.5rem 0;
      font-weight: 500;
    }

    .preview-header p {
      color: var(--ink-2);
      margin: 0;
      font-size: 0.95rem;
    }

    .preview-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 5rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 2rem;
    }

    .preview-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      padding: 0.5rem 1rem;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--ink);
    }
  </style>
</head>
